<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
  <!-- White Printable Background -->
  <rect width="1200" height="1600" fill="#FFFFFF"/>
  
  <!-- Outer Calibration Frame -->
  <rect x="60" y="60" width="1080" height="1480" fill="none" stroke="#111111" stroke-width="18"/>

  <!-- Asymmetric Fiducial & High-Feature AR Tracking Emblem (Top Zone) -->
  <g transform="translate(150, 130)">
    <!-- Asymmetric Anchor Corners (Non-repeating for SLAM/ARCore feature scoring) -->
    <polygon points="0,0 240,0 180,90 90,90 90,180 0,240" fill="#111111"/>
    <polygon points="900,0 900,260 790,190 790,90 670,90" fill="#111111"/>
    <polygon points="0,900 0,650 110,720 110,810 250,810" fill="#111111"/>
    <circle cx="810" cy="810" r="85" fill="#111111"/>
    <circle cx="810" cy="810" r="35" fill="#FFFFFF"/>

    <!-- Central High-Contrast Asymmetric Geometry + Prohibition Slash -->
    <circle cx="450" cy="450" r="290" fill="none" stroke="#D90429" stroke-width="48"/>
    <line x1="245" y1="245" x2="655" y2="655" stroke="#D90429" stroke-width="48"/>

    <!-- Irregular Internal Feature Blocks (Prevents 180-degree rotational ambiguity) -->
    <polygon points="320,380 410,270 460,340 370,440" fill="#111111"/>
    <polygon points="520,290 610,360 550,450 480,390" fill="#111111"/>
    <polygon points="290,520 390,490 430,610 310,620" fill="#111111"/>
    <rect x="490" y="510" width="110" height="45" transform="rotate(-22 490 510)" fill="#111111"/>
    <polygon points="440,630 570,580 590,650" fill="#111111"/>
  </g>

  <!-- Divider Bar -->
  <rect x="120" y="1090" width="960" height="12" fill="#D90429"/>

  <!-- Standardized Legal Notice Text -->
  <text x="600" y="1165" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="bold" fill="#D90429" text-anchor="middle">
    PRIVATE PROPERTY
  </text>
  <text x="600" y="1235" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="bold" fill="#111111" text-anchor="middle">
    No AR application Mapping object ,
  </text>
  <text x="600" y="1295" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="bold" fill="#111111" text-anchor="middle">
    Unauthorized 3D mapping or unauthorized
  </text>
  <text x="600" y="1355" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="bold" fill="#111111" text-anchor="middle">
    landing is prohibited and against the law
  </text>

  <!-- Machine Protocol Footer -->
  <text x="600" y="1475" font-family="monospace" font-size="24" fill="#444444" text-anchor="middle">
    PROTOCOL: ASPM-V1-OPT-OUT | github.com/protikka1/ar-spatial-privacy-marker
  </text>
</svg>
